# Local development services. Production uses Amazon RDS for PostgreSQL 17 (see infra/).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eastside
      POSTGRES_PASSWORD: eastside
      POSTGRES_DB: eastside
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eastside -d eastside']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
